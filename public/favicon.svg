<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Background circle -->
  <circle cx="24" cy="24" r="24" fill="#1F2933"/>
  <!-- Tree trunk -->
  <rect x="21" y="36" width="6" height="7" rx="1" fill="#5CB0ED"/>
  <!-- Tree layers (bottom to top, getting smaller) -->
  <polygon points="24,8 10,30 38,30" fill="#4F6F52"/>
  <polygon points="24,12 11,32 37,32" fill="#5a7f5e"/>
  <!-- Snowflake/star on top -->
  <circle cx="24" cy="10" r="3" fill="#5CB0ED"/>
  <!-- Snow dots on tree -->
  <circle cx="16" cy="27" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="22" cy="23" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="30" cy="26" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="26" cy="19" r="1.2" fill="white" opacity="0.7"/>
</svg>